[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disputelens"
version = "0.1.0"
description = "Local RAG for merchant disputes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "python-dotenv>=1,<2",
    "pypdf>=6,<7",
    "beautifulsoup4>=4.13,<5",
    "qdrant-client==1.19.1",
    "lmstudio==1.5.0",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
